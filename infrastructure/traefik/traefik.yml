api: { dashboard: true, insecure: true }
log: { level: INFO, format: json }
accessLog: { format: json }
metrics:
  prometheus: { addEntryPointsLabels: true, addServicesLabels: true }
entryPoints:
  web: { address: ":80" }
  websecure: { address: ":443" }
providers:
  docker: { exposedByDefault: false, network: spacenet-lab_spacenet-network }
  file: { filename: /etc/traefik/dynamic.yml, watch: true }
certificatesResolvers:
  le:
    acme:
      email: admin@example.com
      storage: /letsencrypt/acme.json
      httpChallenge: { entryPoint: web }
