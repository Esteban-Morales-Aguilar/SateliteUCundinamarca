global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - { job_name: auth-service,       static_configs: [{ targets: ["auth-service:3001"] }] }
  - { job_name: content-service,    static_configs: [{ targets: ["content-service:3002"] }] }
  - { job_name: telemetry-service,  static_configs: [{ targets: ["telemetry-service:3003"] }] }
  - { job_name: simulation-service, static_configs: [{ targets: ["simulation-service:3004"] }] }
  - { job_name: media-service,      static_configs: [{ targets: ["media-service:3005"] }] }
  - { job_name: traefik,            static_configs: [{ targets: ["traefik:8080"] }] }
