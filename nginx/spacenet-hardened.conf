# Aplicar como /etc/nginx/sites-available/spacenet (requiere root).
# Prerrequisito: el router SNI del 443 debe enviar PROXY protocol (ver haproxy/spacenet-sni.cfg).

limit_req_zone $binary_remote_addr zone=spacenet_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=spacenet_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=spacenet_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name satelitecundinamarca.duckdns.org;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
}

server {
    listen 127.0.0.1:18543 ssl proxy_protocol;
    server_name satelitecundinamarca.duckdns.org;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/satelitecundinamarca.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satelitecundinamarca.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' wss://satelitecundinamarca.duckdns.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location /api/v1/auth {
        limit_req zone=spacenet_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:13001;
    }
    location /api/v1/users {
        limit_req zone=spacenet_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:13001;
    }
    location /api/v1/content {
        limit_req zone=spacenet_api burst=40 nodelay;
        limit_conn spacenet_conn 20;
        proxy_pass http://127.0.0.1:13002;
    }
    location /api/v1/telemetry {
        limit_req zone=spacenet_api burst=40 nodelay;
        limit_conn spacenet_conn 20;
        proxy_pass http://127.0.0.1:13003;
    }
    location /api/v1/ws {
        limit_req zone=spacenet_api burst=20 nodelay;
        limit_conn spacenet_conn 10;
        proxy_pass http://127.0.0.1:13003;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location /api/v1/simulation {
        limit_req zone=spacenet_api burst=40 nodelay;
        limit_conn spacenet_conn 20;
        proxy_pass http://127.0.0.1:13004;
    }
    location /api/v1/media/upload {
        client_max_body_size 210m;
        limit_req zone=spacenet_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:13005;
        proxy_request_buffering on;
    }
    location /api/v1/media {
        limit_req zone=spacenet_api burst=40 nodelay;
        limit_conn spacenet_conn 20;
        proxy_pass http://127.0.0.1:13005;
    }
    location / {
        limit_req zone=spacenet_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:18082;
    }
}