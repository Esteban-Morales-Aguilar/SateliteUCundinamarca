# Reemplaza /etc/nginx/stream.conf.d/sni-router.conf (requiere instalar haproxy y root).
# Preserva la IP real hacia SpaceNet mediante PROXY protocol v2.

global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 300s
    timeout server 300s

frontend tls_in
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use-backend spacenet if { req_ssl_sni -i satelitecundinamarca.duckdns.org }
    default_backend openvpn

backend spacenet
    server spacenet 127.0.0.1:18543 send-proxy-v2

backend openvpn
    server openvpn 127.0.0.1:1194