name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Tipos TypeScript (NestJS)
        run: |
          for s in auth-service content-service media-service; do
            (cd services/$s && npm ci && npx tsc --noEmit)
          done
      - name: Tipos TypeScript (frontend)
        run: cd frontend && npm ci && npx tsc --noEmit
      - uses: astral-sh/ruff-action@v1
        with: { src: "services/telemetry-service services/simulation-service" }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Servicios NestJS
        run: |
          for s in auth-service content-service media-service; do
            (cd services/$s && npm ci && npm test)
          done
      - name: Servicios FastAPI
        run: |
          for s in simulation-service telemetry-service; do
            (cd services/$s && pip install -r requirements.txt && python -m pytest -q)
          done
      - name: Frontend (Vitest + build)
        run: cd frontend && npm ci && npm test && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: "services/*/coverage", if-no-files-found: ignore }

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # informativo; los bloqueos los decide Trivy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          for d in services/auth-service services/content-service services/media-service frontend; do
            (cd $d && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high)
          done
      - run: pip install pip-audit && pip-audit -r services/telemetry-service/requirements.txt && pip-audit -r services/simulation-service/requirements.txt

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, content-service, telemetry-service, simulation-service, media-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: spacenet/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: spacenet/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  build-frontend:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: spacenet/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: spacenet/frontend:ci, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (filesystem, IaC y secretos)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: node_modules,frontend/dist
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-fs.sarif }

  e2e:
    needs: [build, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Levantar el stack
        run: |
          cp .env.example .env
          docker compose up -d --build traefik auth-service content-service telemetry-service simulation-service media-service frontend
      - name: Esperar a que el gateway responda
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost/api/v1/content/creditos && exit 0; sleep 5; done
          docker compose logs --tail=80; exit 1
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report }
      - if: always()
        run: docker compose down -v
